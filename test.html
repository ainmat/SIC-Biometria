<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste SIC-Biometria</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body>
  <h1>Teste de Conexão Supabase</h1>
  <div id="status">Carregando...</div>
  <div id="dados"></div>
  
  <script>
    const SUPABASE_URL = 'https://iemysploewouodsoevyv.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_XggfXmsdnywLlSXKiTl3_A_nTwAHa8Y';
    
    console.log('Supabase disponível:', typeof supabase !== 'undefined');
    
    if(typeof supabase !== 'undefined'){
      const _sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      console.log('Cliente criado:', _sb);
      
      async function testar(){
        try {
          document.getElementById('status').textContent = 'Testando conexão...';
          const {data, error} = await _sb.from('chamados').select('*').limit(5);
          
          if(error){
            console.error('Erro:', error);
            document.getElementById('status').textContent = 'Erro: ' + error.message;
          } else {
            console.log('Dados:', data);
            document.getElementById('status').textContent = 'Conexão bem-sucedida! ' + data.length + ' registros encontrados';
            document.getElementById('dados').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
          }
        } catch(e){
          console.error('Exceção:', e);
          document.getElementById('status').textContent = 'Exceção: ' + e.message;
        }
      }
      
      testar();
    } else {
      document.getElementById('status').textContent = 'Erro: Supabase não carregado';
    }
  </script>
</body>
</html>
