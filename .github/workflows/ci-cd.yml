name: 🚀 CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - '.github/workflows/sync-asana.yml'
      - 'scripts/sync_asana.mjs'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.github/workflows/sync-asana.yml'
      - 'scripts/sync_asana.mjs'

env:
  NODE_VERSION: '20'

jobs:
  # 🔍 Quality Checks (Lint, Formatação e Validação)
  quality:
    name: 🔍 Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 📦 Install Dependencies
        run: npm ci
        
      - name: 🔍 Lint Code
        run: npm run lint
        
      - name: 🎨 Format Check
        run: npm run format -- --check
        
      - name: 🌐 Validate HTML
        run: npm run validate
        
      - name: 🔒 Security Audit
        run: npm run security:audit

  # 🧪 Testes Automatizados
  test:
    name: 🧪 Test Suite
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 📦 Install Dependencies
        run: npm ci
        
      - name: 🧪 Run Tests
        run: npm test -- --watchAll=false

  # 🏗️ Build da Aplicação
  build:
    name: 🏗️ Build Application
    runs-on: ubuntu-latest
    needs: [quality, test]
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 📦 Install Dependencies
        run: npm ci
        
      - name: 🏗️ Build Application (Vite)
        run: npm run build
        
      - name: 📦 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: dist/
          retention-days: 14

  # 🚀 Deploy to Production (Executa apenas se o token da Vercel estiver configurado)
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      
    steps:
      - name: 🔍 Check Vercel Token
        id: check_token
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "VERCEL_TOKEN não configurado no GitHub Secrets. Pulando deploy."
          fi

      - name: 📥 Checkout Code
        if: steps.check_token.outputs.has_token == 'true'
        uses: actions/checkout@v4
        
      - name: 📦 Download Build
        if: steps.check_token.outputs.has_token == 'true'
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: dist/
          
      - name: 🚀 Deploy to Vercel
        id: deploy
        if: steps.check_token.outputs.has_token == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./dist

