name: Sincronização Asana Chamados

on:
  schedule:
    # Roda a cada 15 minutos em dias úteis (Segunda a Sexta, das 07:04 às 20:49 Horário de Brasília / 10:04 às 23:49 UTC)
    # Minutos alternativos fora de pico (:04, :19, :34, :49) garantem execução pontual sem bloqueio de fila global
    - cron: '4,19,34,49 10-23 * * 1-5'
  push:
    paths:
      - '.github/workflows/sync-asana.yml'
  workflow_dispatch: # Permite acionar manualmente a qualquer momento pela interface do GitHub

concurrency:
  group: sync-asana
  cancel-in-progress: true

jobs:
  sincronizar:
    name: Sincronizar Asana com Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci --omit=dev

      - name: Validar Conexão Asana
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
        run: |
          if [ -z "$ASANA_ACCESS_TOKEN" ]; then
            echo "❌ ERRO: O secret ASANA_ACCESS_TOKEN não está definido nas configurações do repositório."
            echo "   Vá em Settings > Secrets and variables > Actions e adicione o secret ASANA_ACCESS_TOKEN."
            exit 1
          fi
          TOKEN=$(echo "$ASANA_ACCESS_TOKEN" | sed -E 's/^[Tt]oken:[[:space:]]*//' | sed -E 's/^[Bb]earer[[:space:]]+//' | tr -d '\r\n[:space:]"')
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" https://app.asana.com/api/1.0/users/me)
          if [ "$HTTP_STATUS" -eq 401 ]; then
            echo "❌ ERRO: Asana retornou HTTP 401 (Não Autorizado)."
            echo "   O token configurado em ASANA_ACCESS_TOKEN é inválido ou expirou."
            echo "   Tamanho do token recebido: ${#ASANA_ACCESS_TOKEN} caracteres."
            echo "   💡 Dica: No GitHub Secrets, certifique-se de colar apenas o código (sem 'Token:' na frente)."
            exit 1
          elif [ "$HTTP_STATUS" -ge 400 ]; then
            echo "❌ ERRO: Asana retornou HTTP $HTTP_STATUS ao validar token."
            exit 1
          fi
          echo "✓ ASANA_ACCESS_TOKEN verificado e válido com a API do Asana!"

      - name: Executar Sincronização
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          ASANA_PROJECT_ID: ${{ secrets.ASANA_PROJECT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
        run: node scripts/sync_asana.mjs
